name: Supabase Keep Alive

on:
  schedule:
    # S'exécute à minuit tous les 3 jours (à ajuster si besoin)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Permet de déclencher le workflow manuellement depuis GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY is missing from GitHub Secrets. Please add them in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/recipes?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
